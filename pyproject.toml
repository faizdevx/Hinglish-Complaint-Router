[project]
name = "hinglish-complaint-router"
version = "1.0.0"
description = "Multilingual multi-task message router: intent, urgency, escalation, route (BiLSTM vs MuRIL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["src", "src.models", "src.training", "src.integrations", "app", "app.services"]
